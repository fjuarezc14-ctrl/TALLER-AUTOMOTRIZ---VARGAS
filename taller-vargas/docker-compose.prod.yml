# =========================================================
# TALLER VARGAS — Producción
# =========================================================
# Antes de levantar:
#   cp .env.example .env
#   cp backend/.env.example backend/.env
#   Editar ambos .env con credenciales y dominio reales
#
# Levantar:
#   docker compose -f docker-compose.prod.yml up -d --build
# =========================================================

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: taller_vargas_web_prod
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - taller_vargas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: taller_vargas_backend_prod
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      - taller_vargas_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - taller_vargas_net

  db:
    image: postgres:16-alpine
    container_name: taller_vargas_db_prod
    environment:
      - POSTGRES_USER=${DB_USER:-vargas_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-vargas_password}
      - POSTGRES_DB=${DB_NAME:-taller_vargas_db}
    volumes:
      - taller_vargas_postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vargas_user} -d ${DB_NAME:-taller_vargas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - taller_vargas_net

volumes:
  taller_vargas_postgres_data:
    name: taller_vargas_postgres_data_prod
  taller_vargas_uploads:
    name: taller_vargas_uploads_prod

networks:
  taller_vargas_net:
    name: taller_vargas_net_prod
    driver: bridge
