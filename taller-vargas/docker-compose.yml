version: "3.8"

# =========================================================
# TALLER VARGAS — DESARROLLO LOCAL (no usar en producción)
# =========================================================
# Antes de levantar:
#   cp .env.example .env
#   cp backend/.env.example backend/.env
#
# Levantar:
#   docker compose up -d --build
#
# Producción:
#   docker compose -f docker-compose.prod.yml up -d --build
# =========================================================

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: taller_vargas_web
    ports:
      - "${WEB_PORT:-5174}:5174"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - taller_vargas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: taller_vargas_backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://vargas_user:vargas_password@db:5432/taller_vargas_db}
      - PORT=3001
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - taller_vargas_net

  db:
    image: postgres:16-alpine
    container_name: taller_vargas_db
    ports:
      - "${DB_PORT:-5436}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-vargas_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-vargas_password}
      - POSTGRES_DB=${DB_NAME:-taller_vargas_db}
    volumes:
      - taller_vargas_postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vargas_user} -d ${DB_NAME:-taller_vargas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taller_vargas_net

volumes:
  taller_vargas_postgres_data:
    name: taller_vargas_postgres_data

networks:
  taller_vargas_net:
    name: taller_vargas_net
    driver: bridge
